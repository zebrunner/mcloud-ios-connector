---
version: 2
updates:
  # actions/* and the other actions of .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # the pinned base image (version and digest) of Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # the linters of tests/requirements-lint.txt
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
